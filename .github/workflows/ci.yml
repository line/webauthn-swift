name: CI

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build

  test:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test

